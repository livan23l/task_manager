<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administra tus tareas</title>
    <link rel="shortcut icon" href="public/img/icon.webp" type="image/webp">
    <link rel="stylesheet" href="public/css/app.css">
</head>

<body class="page">
    <!-- Templates -->
    <template id="template-empty">
        <div class="empty">
            <div class="mt-lg text-3xl button button-rounded button-primary">+</div>
        </div>
    </template>

    <!-- Header text -->
    <header class="header">
        <h1 class="header__title">
            <a class="anchor" href="index.html">
                <span class="text-primary-dark">T</span>ask <span class="text-primary-dark">M</span>anager
            </a>
        </h1>
    </header>

    <!-- Task Manager -->
    <main class="main">
        <!-- Options Menu -->
        <nav class="menu">
            <ol class="menu__container">
                <li id="tasks-pending" class="menu__option menu__option--active">Pendientes</li>
                <li id="tasks-performed" class="menu__option">Realizadas</li>
                <li id="tasks-all" class="menu__option">Todas</li>
            </ol>
        </nav>

        <!-- Tasks section -->
        <section id="principal" class="principal">
        </section>
    </main>

    <script src="public/js/app.js"></script>
</body>

</html>
